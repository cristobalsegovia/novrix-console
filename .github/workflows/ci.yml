# Continuous integration for Novrix Console (Tauri 2 + Rust + React).
#
# Two layers of checks:
#
#   1. `core` — the fast, always-on gate. Runs on all three target OSes
#      (Linux, macOS, Windows) and does exactly what we run locally: build the
#      Rust library, run the full unit/property test suite (`cargo test --lib`),
#      lint (clippy + rustfmt), and build the frontend. This is 100% real today.
#
#   2. The integration / smoke / performance jobs — these cover the spec's
#      tasks that need real OS services or hardware this project cannot exercise
#      on a single dev machine (live SSH/Telnet servers, OS secure storage, both
#      OSes, stable timing). They stand up the needed service (e.g. an OpenSSH
#      container) and run the Rust tests tagged `#[ignore]` for that boundary
#      via `cargo test -- --ignored`.
#
#      IMPORTANT: those `#[ignore]`d integration tests are not written yet (spec
#      tasks 5.5, 9.3, 10.4, 11.4, 15.6, 16.7, 24.1, 24.2). Until they exist,
#      `cargo test -- --ignored` simply finds no tests and succeeds, so these
#      jobs are harmless no-ops that already provision the right environment.
#      Each job documents exactly which task it will run once its tests land.
#
# Triggers: every push to main and every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Core gate: build + full test suite + lint + frontend, on all three OSes.
  # ---------------------------------------------------------------------------
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust (stable + components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Tauri's Linux build needs system libraries (webkit2gtk etc.). The core
      # job only builds the *library* and runs tests, which do not link the
      # webview, but installing these keeps a future `cargo build` of the full
      # app green on the Linux runner too.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libudev-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Rustfmt (check)
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy (library)
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Build (library)
        working-directory: src-tauri
        run: cargo build --lib

      - name: Test (unit + property suite)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build frontend (tsc + vite)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Integration: SSH + SFTP against a live OpenSSH server (spec tasks 15.6, 16.7).
  # Runs `ssh_live_connect_auth_and_open_sftp`, which connects over the real
  # russh transport, authenticates with a password, and opens the SFTP
  # subsystem. Kept non-blocking because it depends on a third-party service
  # container that can occasionally be flaky on the runner.
  # ---------------------------------------------------------------------------
  integration-ssh:
    name: Integration — SSH/SFTP (live OpenSSH)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: tester
          USER_PASSWORD: testpass
          SUDO_ACCESS: "false"
        ports:
          - 2222:2222
    env:
      NOVRIX_IT_SSH_HOST: 127.0.0.1
      NOVRIX_IT_SSH_PORT: "2222"
      NOVRIX_IT_SSH_USER: tester
      NOVRIX_IT_SSH_PASSWORD: testpass
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Run SSH/SFTP integration test (tasks 15.6, 16.7)
        working-directory: src-tauri
        run: cargo test --lib -- --ignored --nocapture ssh_live

  # ---------------------------------------------------------------------------
  # Integration: Telnet against a live echo server (spec task 9.3).
  # ---------------------------------------------------------------------------
  integration-telnet:
    name: Integration — Telnet (live server)
    runs-on: ubuntu-latest
    env:
      NOVRIX_IT_TELNET_HOST: 127.0.0.1
      NOVRIX_IT_TELNET_PORT: "2323"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config socat
      - name: Start a telnet echo server
        run: |
          nohup socat TCP-LISTEN:2323,reuseaddr,fork EXEC:'/bin/cat' >/tmp/telnet.log 2>&1 &
          sleep 2
      - name: Run Telnet integration test (task 9.3)
        working-directory: src-tauri
        run: cargo test --lib -- --ignored --nocapture telnet_live

  # ---------------------------------------------------------------------------
  # Integration: Serial over a virtual port pair (spec task 10.4). socat links
  # two PTYs; the test opens one end through the real serialport backend. On
  # Linux a socat PTY accepts the termios ioctls the serialport crate issues.
  # ---------------------------------------------------------------------------
  integration-serial:
    name: Integration — Serial (virtual port)
    runs-on: ubuntu-latest
    env:
      NOVRIX_IT_SERIAL_PORT: /tmp/ttyNVX_A
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config socat
      - name: Create a linked virtual serial port pair
        run: |
          nohup socat PTY,link=/tmp/ttyNVX_A,raw,echo=0 PTY,link=/tmp/ttyNVX_B,raw,echo=0 \
            >/tmp/socat_serial.log 2>&1 &
          sleep 2
      - name: Run Serial integration test (task 10.4)
        working-directory: src-tauri
        run: cargo test --lib -- --ignored --nocapture serial_live

  # ---------------------------------------------------------------------------
  # Integration: OS secure storage (spec task 5.5). The Keychain (macOS) /
  # Credential Manager (Windows) round-trip. Linux has no default Secret
  # Service on the runner, so the test skips there; macOS/Windows exercise it.
  # ---------------------------------------------------------------------------
  integration-secure-storage:
    name: Integration — Secure storage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Run secure-storage integration test (task 5.5)
        working-directory: src-tauri
        run: cargo test --lib -- --ignored --nocapture secure_storage

  # ---------------------------------------------------------------------------
  # Integration: RDP against a live server (spec task 11.4). No RDP host is
  # provisioned by default, so the test SKIPS unless NOVRIX_IT_RDP_* secrets are
  # set (point them at a reachable RDP server to run it for real). Non-blocking.
  # ---------------------------------------------------------------------------
  integration-rdp:
    name: Integration — RDP (live server, opt-in)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NOVRIX_IT_RDP_HOST: ${{ secrets.NOVRIX_IT_RDP_HOST }}
      NOVRIX_IT_RDP_PORT: ${{ secrets.NOVRIX_IT_RDP_PORT }}
      NOVRIX_IT_RDP_USER: ${{ secrets.NOVRIX_IT_RDP_USER }}
      NOVRIX_IT_RDP_PASSWORD: ${{ secrets.NOVRIX_IT_RDP_PASSWORD }}
      NOVRIX_IT_RDP_DOMAIN: ${{ secrets.NOVRIX_IT_RDP_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Run RDP integration test (task 11.4)
        working-directory: src-tauri
        run: cargo test --lib -- --ignored --nocapture rdp_live

  # ---------------------------------------------------------------------------
  # Smoke: application startup on macOS and Windows (spec task 24.1).
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke — startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Run startup smoke test (task 24.1)
        working-directory: src-tauri
        run: cargo test --lib -- --ignored --nocapture startup

  # ---------------------------------------------------------------------------
  # Performance: timing / capacity bounds (spec task 24.2). Release build so the
  # measurements reflect optimized code; dedicated job for stable timing.
  # ---------------------------------------------------------------------------
  performance:
    name: Performance — timing & capacity bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - name: Run performance test (task 24.2)
        working-directory: src-tauri
        run: cargo test --lib --release -- --ignored --nocapture perf
